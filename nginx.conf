##
# Static hosting for the prerendered output of `nuxt generate`.
#
# Nuxt writes directory-style routes (/products/notes/index.html), and every
# internal link is verified at build time by `nitro.prerender.failOnError`, so a
# miss here is a genuine 404 rather than something to paper over with an SPA
# fallback.
#
# Do not add a `types { ... }` block to this file. In nginx a nested `types`
# block REPLACES the inherited map rather than extending it, so a single entry
# here silently discards all of /etc/nginx/mime.types. With the base image's
# `default_type application/octet-stream`, every response then becomes a file
# download instead of a page. Override one extension with a scoped
# `default_type` in its own location, as done for the sitemap stylesheet below.
##

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Stops the Server header advertising the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml text/xsl application/javascript application/json application/xml image/svg+xml;

    # Content-hashed by the build — the filename changes whenever the bytes do,
    # so these can be cached indefinitely. _fonts is included because
    # @nuxt/fonts self-hosts Google Fonts locally at build time (no third-party
    # request, no visitor IP leaked) and hashes them the same way.
    location ~* ^/(_nuxt|_fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # The stylesheet that makes sitemap_index.xml readable in a browser. `xsl` is
    # absent from nginx's default map, and `default_type` is only consulted when
    # the map yields nothing, so this is safe whether or not that changes.
    location = /__sitemap__/style.xsl {
        default_type text/xsl;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Everything not content-hashed: HTML, robots.txt, the sitemaps, favicons,
    # _payload.json and __nuxt_content. All are keyed to a build rather than to
    # their contents, so they must revalidate or a redeploy stays invisible to
    # anyone who has already visited.
    #
    # This header belongs here rather than in a `location ~* \.html$` block,
    # which looks like the obvious place and silently does nothing: try_files
    # resolves /pricing to /pricing/index.html without re-running location
    # matching, so a regex on the URI never sees the .html suffix.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # $uri/index.html is named explicitly rather than relying on $uri/, which
        # would hand off to the index module and 301 to add a trailing slash.
        # Both the internal links and the sitemap use the bare form
        # -- /pricing, not /pricing/ -- and the canonical tag says
        # https://numori.app/pricing, so $uri/ would make every published URL,
        # canonical included, redirect once before it resolved.
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
