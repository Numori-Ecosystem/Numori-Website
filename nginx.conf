##
# Static hosting for the prerendered output of `nuxt generate`.
#
# Nuxt writes directory-style routes (/products/notes/index.html), and every
# internal link is verified at build time by `nitro.prerender.failOnError`, so a
# miss here is a genuine 404 rather than something to paper over with an SPA
# fallback.
##

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The XSL stylesheet that makes the sitemap readable in a browser is not in
    # nginx's default mime.types, and would otherwise be sent as a download.
    types {
        text/xsl xsl;
    }

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    # Not built by this site, but harmless to withhold: it stops the version
    # number in the Server header from advertising which nginx to attack.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/xsl application/javascript application/json application/xml image/svg+xml;

    # Content-hashed by the build — the filename changes whenever the bytes do,
    # so these can be cached indefinitely. _fonts is included because
    # @nuxt/fonts self-hosts Google Fonts locally at build time (no third-party
    # request, no visitor IP leaked) and hashes them the same way.
    location ~* ^/(_nuxt|_fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML must revalidate, otherwise a redeploy stays invisible to anyone who
    # has already visited until the cache expires.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Payload and content files are keyed to a build, not hashed, so they follow
    # the HTML rather than the immutable assets.
    location ~* ^/(_payload\.json$|__nuxt_content/) {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
        # $uri/ resolves a directory to its index internally, which is what makes
        # /products/notes work without a redirect to /products/notes/.
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
